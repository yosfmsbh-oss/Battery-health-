name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and arrange project files
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project
          if [ -f project/settings.gradle.kts ]; then
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          else
            SUB=$(dirname "$(find project -name settings.gradle.kts | head -n 1)")
            echo "PROJECT_DIR=$SUB" >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryHealth-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
